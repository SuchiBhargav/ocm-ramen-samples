---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: quay.io/nirsof/busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" | tee -a /pvc-data-1/ramen.log /pvc-data-2/ramen.log /pvc-data-3/ramen.log
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 10 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: pvc-data-1
              mountPath: /pvc-data-1
            - name: pvc-data-2
              mountPath: /pvc-data-2
            - name: pvc-data-3
              mountPath: /pvc-data-3
      volumes:
        - name: pvc-data-1
          persistentVolumeClaim:
            claimName: busybox-pvc-1
        - name: pvc-data-2
          persistentVolumeClaim:
            claimName: busybox-pvc-2
        - name: pvc-data-3
          persistentVolumeClaim:
            claimName: busybox-pvc-3
