---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: quay.io/nirsof/busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" | tee -a /mnt/pvc-1/ramen.log /mnt/pvc-2/ramen.log /mnt/pvc-3/ramen.log /mnt/pvc-4/ramen.log
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 10 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: pvc-1
              mountPath: /mnt/pvc-1
            - name: pvc-2
              mountPath: /mnt/pvc-2
            - name: pvc-3
              mountPath: /mnt/pvc-3
            - name: pvc-4
              mountPath: /mnt/pvc-4
      volumes:
        - name: pvc-1
          persistentVolumeClaim:
            claimName: busybox-pvc-1
        - name: pvc-2
          persistentVolumeClaim:
            claimName: busybox-pvc-2
        - name: pvc-3
          persistentVolumeClaim:
            claimName: busybox-pvc-3
        - name: pvc-4
          persistentVolumeClaim:
            claimName: busybox-pvc-4
